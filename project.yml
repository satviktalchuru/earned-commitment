name: EarnedCommitment
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  EarnedCommitment:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.satviktalchuru.earnedcommitment
        INFOPLIST_KEY_CFBundleDisplayName: Earned Commitment
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: EarnedCommitment
        INFOPLIST_FILE: App/Resources/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0"
        INFOPLIST_KEY_CFBundleVersion: "2"
    scheme:
      testTargets:
        - EarnedCommitmentTests
  EarnedCommitmentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: EarnedCommitment
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.satviktalchuru.earnedcommitment.tests
        GENERATE_INFOPLIST_FILE: YES
